name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test windows/AELanguageSwitcher.Windows.sln -c Release

      - name: Publish single-file EXE
        shell: pwsh
        run: |
          dotnet publish windows/src/AELanguageSwitcher.App/AELanguageSwitcher.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -o windows/artifacts/win-x64
          Move-Item windows/artifacts/win-x64/AE-Language-Switcher.exe `
            windows/artifacts/AE-Language-Switcher-win-x64.exe
          (Get-FileHash windows/artifacts/AE-Language-Switcher-win-x64.exe -Algorithm SHA256).Hash.ToLower() + `
            '  AE-Language-Switcher-win-x64.exe' | `
            Set-Content windows/artifacts/AE-Language-Switcher-win-x64.exe.sha256 -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AE-Language-Switcher-win-x64
          path: |
            windows/artifacts/AE-Language-Switcher-win-x64.exe
            windows/artifacts/AE-Language-Switcher-win-x64.exe.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes/v1.0.0.md
          files: |
            windows/artifacts/AE-Language-Switcher-win-x64.exe
            windows/artifacts/AE-Language-Switcher-win-x64.exe.sha256
